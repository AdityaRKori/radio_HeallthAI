<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc"/>
  
  <!-- Navbar -->
  <rect width="800" height="50" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="30" font-family="Arial" font-size="14" font-weight="bold" fill="#1e293b">Qure-OS</text>

  <!-- Title -->
  <text x="30" y="90" font-family="Arial" font-size="20" font-weight="bold" fill="#1e293b">Clinical Decision Support</text>

  <!-- Main AI Tool Area -->
  <g transform="translate(30, 110)">
    <rect width="740" height="360" rx="12" fill="white" filter="url(#shadow)"/>
    
    <!-- Left Col: X-Ray Image -->
    <rect x="20" y="60" width="340" height="280" rx="8" fill="#1e293b"/>
    <!-- Ribcage abstraction -->
    <path d="M100 100 Q 190 120 280 100" stroke="#475569" stroke-width="15" fill="none" transform="translate(0, 50)"/>
    <path d="M110 140 Q 190 160 270 140" stroke="#475569" stroke-width="15" fill="none" transform="translate(0, 50)"/>
    <path d="M120 180 Q 190 200 260 180" stroke="#475569" stroke-width="15" fill="none" transform="translate(0, 50)"/>
    <!-- Bounding Box -->
    <rect x="200" y="120" width="60" height="60" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5"/>
    <rect x="200" y="110" width="80" height="20" rx="2" fill="#ef4444"/>
    <text x="205" y="124" font-family="Arial" font-size="10" font-weight="bold" fill="white">Nodule (92%)</text>
    
    <!-- Right Col: Findings -->
    <g transform="translate(380, 20)">
        <text x="0" y="20" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">AI Preliminary Analysis</text>
        <line x1="0" y1="40" x2="340" y2="40" stroke="#e2e8f0"/>
        
        <!-- Primary Finding -->
        <text x="0" y="70" font-family="Arial" font-size="11" font-weight="bold" fill="#64748b">PRIMARY FINDING</text>
        <rect x="0" y="80" width="160" height="24" rx="12" fill="#fee2e2"/>
        <text x="10" y="96" font-family="Arial" font-size="12" font-weight="bold" fill="#991b1b">Probable Tuberculosis</text>
        
        <!-- Confidence -->
        <text x="0" y="130" font-family="Arial" font-size="11" font-weight="bold" fill="#64748b">CONFIDENCE SCORE</text>
        <rect x="0" y="140" width="300" height="8" rx="4" fill="#e2e8f0"/>
        <rect x="0" y="140" width="280" height="8" rx="4" fill="#3b82f6"/>
        <text x="310" y="148" font-family="Arial" font-size="12" font-weight="bold" fill="#1e293b">92%</text>

        <!-- Observations List -->
        <text x="0" y="180" font-family="Arial" font-size="11" font-weight="bold" fill="#64748b">KEY OBSERVATIONS</text>
        <circle cx="5" cy="200" r="3" fill="#14b8a6"/>
        <text x="15" y="204" font-family="Arial" font-size="12" fill="#334155">Consolidation in upper right lobe</text>
        <circle cx="5" cy="225" r="3" fill="#14b8a6"/>
        <text x="15" y="229" font-family="Arial" font-size="12" fill="#334155">Cavitation consistent with active TB</text>

        <!-- Actions -->
        <rect x="0" y="280" width="150" height="40" rx="4" fill="#0d9488"/>
        <text x="35" y="305" font-family="Arial" font-size="13" font-weight="bold" fill="white">Confirm Diagnosis</text>
        <rect x="160" y="280" width="150" height="40" rx="4" fill="#f1f5f9"/>
        <text x="195" y="305" font-family="Arial" font-size="13" font-weight="bold" fill="#475569">Reject Finding</text>
    </g>
  </g>
</svg>